[package]
name = "orifude"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A quiet, offline folding and ink puzzle game for the terminal"
license = "Apache-2.0"
repository = "https://github.com/nuggocto/orifude"
homepage = "https://orifude.com"
readme = "README.md"
publish = false

resolver = "3"

[features]
isolated-test-paths = []

[[bin]]
name = "orifude"
path = "src/main.rs"

[package.metadata.orifude.platforms.linux]
minimum-kernel = "5.10"
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
qa-distributions = [
    "Ubuntu 24.04",
    "Debian 12",
    "Fedora (current at release-candidate QA)",
    "Arch Linux (current at release-candidate QA)",
]

[package.metadata.orifude.platforms.macos]
minimum-version = "13"
targets = ["x86_64-apple-darwin", "aarch64-apple-darwin"]

[package.metadata.orifude.platforms.windows]
minimum-version = "10 22H2"
targets = ["x86_64-pc-windows-msvc"]

[dependencies]
crossterm = "=0.29.0"
directories = "6.0.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "limits"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
spdx = "0.13.5"
toml = { version = "1.1.4", default-features = false, features = ["display", "parse", "serde", "std"] }
time = { version = "=0.3.55", features = ["local-offset"] }
zip = { version = "8.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dev-dependencies]
conpty-oxide = { version = "=0.1.2", default-features = false, features = ["blocking"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.release]
# Preserve checked arithmetic in shipped puzzle-state transitions.
overflow-checks = true
panic = "unwind"

name: Published release verification

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Verify public installers before package publication, or public package channels afterward
        type: choice
        options: [installers, packages]
        required: true

permissions:
  contents: read

concurrency:
  group: published-${{ inputs.stage }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    if: inputs.stage == 'installers'
    name: public installer (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: "--jobs 1 rust"
          cache: "false"
      - name: Install, play, save, and restart from the public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run published-check -- ${{ matrix.target }} installer

  packages:
    if: inputs.stage == 'packages'
    name: public package (${{ matrix.channel }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            channel: homebrew
          - target: aarch64-apple-darwin
            runner: macos-15
            channel: homebrew
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            channel: scoop
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            channel: aur
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: "--jobs 1 rust"
          cache: "false"
      - name: Install, play, save, and restart through the public package channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run published-check -- ${{ matrix.target }} ${{ matrix.channel }}

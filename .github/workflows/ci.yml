name: CI

on:
  push:
    branches: [shrek]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check Go packages
        run: |
          test -n "$(go list ./...)"
          go test ./...
          go test -race ./...
          go vet ./...
          go tool govulncheck ./...

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify PostgreSQL integration
        run: ./testdata/postgres/check.sh

  vhs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify offline TUI journey
        run: ./testdata/vhs/check.sh

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate database code
        run: |
          if test -n "$(git ls-files 'sql/queries/*.sql')"; then
            go tool sqlc generate
          fi
      - run: git diff --exit-code -- internal/database/dbgen
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/database/dbgen)"

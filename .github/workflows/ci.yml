name: CI

on:
  push:
    branches: [shrek]
    paths-ignore: ['docs/**', 'CONTRIBUTING.md', 'IDEAS.md']
    tags: ["v*"]
  pull_request:
    branches: [shrek]
    paths-ignore: ['docs/**', 'CONTRIBUTING.md', 'IDEAS.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: Nix player (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and exercise the installed Nix package
        # Docker isolates the build; no host credentials or writable checkout are mounted.
        run: |
          docker run --rm --cpus 2 --memory 6g --pids-limit 512 \
            --security-opt no-new-privileges \
            --volume "$PWD:/work:ro" --workdir /work \
            nixos/nix@sha256:7a007c766426c1877758ddc5cb87a965ac131fc78c582ce0083d922d51ae945c \
            nix --extra-experimental-features 'nix-command flakes' \
              flake check path:/work --no-update-lock-file \
              --option sandbox false --print-build-logs

  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: "true"
          install_args: "--locked rust github:EmbarkStudios/cargo-deny shellcheck@0.11.0"
          cache: "false"

      - name: Check the repository
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run check

  native-player:
    name: native player (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
          - platform: macOS Intel
            runner: macos-15-intel
          - platform: macOS Apple Silicon
            runner: macos-15
          - platform: Windows x86_64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: ${{ startsWith(matrix.runner, 'macos-') && '13.0' || '' }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: "true"
          install_args: "--locked rust"
          cache: "false"

      - name: Check Windows lint policy
        if: runner.os == 'Windows'
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run lint

      - name: Exercise the complete player journey
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run test-native-release

      - name: Exercise the production command surface
        run: |
          cargo build --locked --release
          cargo run --quiet --locked --release -- --version
          cargo run --quiet --locked --release -- verify puzzles/example-pack

  linux-distributions:
    name: Linux distribution compatibility
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: "true"
          install_args: "--locked rust"
          cache: "false"

      - name: Build the Linux musl release binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Exercise pinned distribution userlands
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run linux-distribution-check -- "$PWD/target/x86_64-unknown-linux-musl/release/orifude"

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check known vulnerabilities
        run: |
          if test -n "$(go list ./...)"; then
            go tool govulncheck ./...
          fi

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate database code
        run: |
          if test -n "$(git ls-files 'sql/queries/*.sql')"; then
            go tool sqlc generate
          fi
      - run: git diff --exit-code -- internal/database/dbgen
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/database/dbgen)"

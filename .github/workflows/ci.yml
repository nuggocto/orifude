name: CI

on:
  push:
    branches: [shrek]
  pull_request:
    branches: [shrek]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: "true"
          install_args: "--locked rust github:EmbarkStudios/cargo-deny"
          cache: "false"

      - name: Check the repository
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run check

  terminal-smoke:
    name: terminal smoke (${{ matrix.platform }})
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
          - platform: macOS Apple Silicon
            runner: macos-15
          - platform: Windows x86_64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the declared Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install: "true"
          install_args: "--locked rust"
          cache: "false"

      - name: Exercise terminal restoration
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run terminal-smoke

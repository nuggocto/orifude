name: CI

on:
  push:
    branches: [shrek]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check Go packages
        run: |
          test -n "$(go list ./...)"
          go test ./...
          go test -race ./...
          go vet ./...
          go tool govulncheck ./...

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify PostgreSQL integration
        run: ./testdata/postgres/check.sh

  vhs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify offline TUI journey
        run: ./testdata/vhs/check.sh

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate database code
        run: |
          if test -n "$(git ls-files 'sql/queries/*.sql')"; then
            go tool sqlc generate
          fi
      - run: git diff --exit-code -- internal/database/dbgen
      - run: test -z "$(git status --porcelain --untracked-files=all -- internal/database/dbgen)"

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check
      - name: Build the release matrix
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
      - name: Check archives and checksums
        run: ./scripts/check-release.sh dist
      - name: Render Homebrew formula
        run: |
          ./scripts/render-homebrew.sh dist > /tmp/orifude.rb
          ruby -c /tmp/orifude.rb

  installers:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check POSIX installer behavior
        if: runner.os == 'Linux'
        run: ./scripts/install_test.sh
      - name: Check PowerShell installer behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_test.ps1

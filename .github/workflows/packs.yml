name: Puzzle packs

on:
  pull_request:
    branches: [shrek]
    paths-ignore: ['docs/**', 'CONTRIBUTING.md', 'IDEAS.md']
  push:
    branches: [shrek]
    paths-ignore: ['docs/**', 'CONTRIBUTING.md', 'IDEAS.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out trusted validator code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          path: validator
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          working_directory: validator
          install_args: "--locked rust"
          cache: "false"
      - name: Build before reading submitted content
        working-directory: validator
        env:
          MISE_GITHUB_TOKEN: ""
        run: mise run pack-tool-build
      - name: Check out submission data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          path: submission
          sparse-checkout: community
      - name: Validate and solve without credentials or network access
        working-directory: validator
        run: mise run pack-sandbox -- "$PWD/target/release/examples/pack_release" "$GITHUB_WORKSPACE/submission/community"

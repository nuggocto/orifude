name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'nuggocto/orifude'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify release tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse refs/remotes/origin/shrek)" = "${GITHUB_SHA}"
          release_version=${GITHUB_REF_NAME#v}
          grep -Fqx "version=\"${release_version}\"" scripts/install.sh
          grep -Fqx "\$ReleaseVersion = \"${release_version}\"" scripts/install.ps1
      - name: Test release source
        run: go test ./...
      - name: Publish archives and package metadata
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: ./scripts/publish-homebrew.sh dist "${GITHUB_REF_NAME#v}"

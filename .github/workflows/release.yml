name: Release publication

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full approved shrek commit hash
        required: true
      tag:
        description: Signed release tag matching the package version
        required: true
      candidate_run:
        description: Successful Release candidate run for this exact commit
        required: true
      publish:
        description: Publish the verified immutable release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/shrek' && inputs.commit == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.8.16
          install_args: "python@3.14.7"
          cache: "false"
      - name: Inspect or publish the exact candidate
        env:
          GH_TOKEN: ${{ inputs.publish && secrets.RELEASE_TOKEN || github.token }}
          APPROVED_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          arguments=("$RELEASE_TAG" "$APPROVED_COMMIT" "$CANDIDATE_RUN")
          if [[ "$PUBLISH" == true ]]; then arguments+=(--publish); fi
          mise run release-publish -- "${arguments[@]}"

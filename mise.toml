min_version = "2026.8.14"

[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
"github:EmbarkStudios/cargo-deny" = "0.20.2"

[tasks.run]
description = "Run Orifude"
raw_args = true
quiet = true
run = "cargo run --quiet --locked --"

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks.fmt-check]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint every Rust target"
run = "cargo clippy --locked --all-targets --features isolated-test-paths -- -D warnings"

[tasks.test]
description = "Test every Rust target"
run = "cargo test --locked --all-targets --features isolated-test-paths"

[tasks.test-native]
description = "Exercise the complete player journey in a native pseudoterminal"
run = "cargo test --locked --test terminal_pty --features isolated-test-paths"

[tasks.doctest]
description = "Test Rust documentation examples"
run = "cargo test --locked --doc"

[tasks.build]
description = "Build the release binary"
run = "cargo build --locked --release"

[tasks.paper]
description = "Run the plain-text paper exercise"
run = "cargo run --quiet --locked --example paper"

[tasks.paper-measure]
description = "Measure the paper representations in a release build"
run = "cargo run --quiet --locked --release --example paper_measure"

[tasks.solver-measure]
description = "Measure bounded solver search in a release build"
run = "cargo run --quiet --locked --release --example solver_measure"

[tasks.domain-fuzz]
description = "Run the bounded domain-action fuzz harness"
run = "cargo run --quiet --locked --release --example domain_actions_fuzz"

[tasks.puzzle-parser-fuzz]
description = "Run the bounded puzzle-parser fuzz harness"
run = "cargo run --quiet --locked --release --example puzzle_parser_fuzz"

[tasks.pack-metadata-fuzz]
description = "Run the bounded pack-metadata fuzz harness"
run = "cargo run --quiet --locked --release --example pack_metadata_fuzz"

[tasks.replay-parser-fuzz]
description = "Run the bounded replay-parser fuzz harness"
run = "cargo run --quiet --locked --release --example replay_parser_fuzz"

[tasks.archive-parser-fuzz]
description = "Run the bounded ZIP-parser fuzz harness"
run = "cargo run --quiet --locked --release --example archive_parser_fuzz"

[tasks.fuzz-campaign]
description = "Run the bounded sanitizer-backed fuzz campaigns"
run = "bash scripts/fuzz-campaign.sh"

[tasks.fuzz-campaign.tools]
"cargo:cargo-fuzz" = "0.13.2"

[tasks.property-check]
description = "Run the deterministic property and independent-model checks"
run = "bash scripts/property-check.sh"

[tasks.secret-scan]
description = "Scan the local tree and Git history for high-confidence credentials"
run = "bash scripts/secret-scan.sh"

[tasks.shell-check]
description = "Check release shell automation"
run = [
    "sh -n scripts/release/install.sh.in",
    "bash -n scripts/release/PKGBUILD.in",
    "shellcheck scripts/release/install.sh.in",
    "shellcheck -s bash -e SC2034 scripts/release/PKGBUILD.in",
    "bash -n scripts/fuzz-campaign.sh scripts/linux-distribution-check.sh scripts/property-check.sh scripts/release-measure.sh scripts/secret-scan.sh",
    "shellcheck scripts/fuzz-campaign.sh scripts/linux-distribution-check.sh scripts/property-check.sh scripts/release-measure.sh scripts/secret-scan.sh",
]

[tasks.shell-check.tools]
shellcheck = "0.11.0"

[tasks.storage-measure]
description = "Measure durable completion writes in a release build"
run = "cargo run --quiet --locked --release --example storage_measure"

[tasks.lifecycle-check]
description = "Exercise direct-binary install, upgrade, rollback, removal, and saved state on Linux"
raw_args = true
run = "cargo run --quiet --locked --release --example release_lifecycle --"

[tasks.release-measure]
description = "Measure the optimized terminal, process, solver, storage, and binary on Linux"
raw_args = true
run = "bash scripts/release-measure.sh"

[tasks.linux-distribution-check]
description = "Exercise the Linux musl binary in pinned distribution userlands"
raw_args = true
run = "bash scripts/linux-distribution-check.sh"

[tasks.release-test]
description = "Test every Rust target in the release profile"
run = "cargo test --locked --release --all-targets --features isolated-test-paths"

[tasks.test-native-release]
description = "Exercise the complete player journey with a release-profile binary"
run = "cargo test --locked --release --test terminal_pty --features isolated-test-paths"

[tasks.audit]
description = "Check dependency advisories, licenses, and sources"
run = [
    "cargo deny --locked check",
    "cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml --locked check advisories licenses sources",
]

[tasks.release-check]
description = "Run release-profile code, policy, and native terminal checks"
run = [
    { task = "fmt-check" },
    { task = "shell-check" },
    { task = "audit" },
    { task = "lint" },
    { task = "release-test" },
    { task = "doctest" },
    { task = "build" },
]

[tasks.check]
description = "Run every ordinary repository check in a safe order"
run = [
    { task = "fmt-check" },
    { task = "shell-check" },
    { task = "audit" },
    { task = "lint" },
    { task = "test" },
    { task = "doctest" },
    { task = "build" },
]

[tasks.release-build]
description = "Build and package one native release target"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- build"

[tasks.release-assemble]
description = "Generate installers and package metadata from the complete archive set"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- assemble"

[tasks.release-verify]
description = "Verify archives, hashes, installers, and package metadata"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- check"

[tasks.release-tool-test]
description = "Test release archive and manifest integrity"
run = "cargo test --locked --example distribution"

[tasks.installer-check]
description = "Exercise generated installers against a private HTTPS fixture"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- installer-check"

[tasks.release-publish]
description = "Inspect a verified release proposal; publication requires --publish"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- publish"

[tasks.release-channel]
description = "Inspect a candidate package update; verified external writes require --push"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- channel"

[tasks.artifact-check]
description = "Play, save, restart, and replay using an extracted production archive"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- artifact-check"

[tasks.package-channel-check]
description = "Install the candidate through its native package channel"
raw_args = true
run = "cargo run --quiet --locked --example distribution -- package-check"

[tools]
go = "1.27.0"

[tasks.dev]
description = "Run the TUI"
run = "go run ./cmd/orifude"

[tasks.dev-online]
description = "Run an interactive TUI against a disposable local post office"
run = "./testdata/dev-online/run.sh"

[tasks.postoffice]
description = "Run the post office with server environment variables"
run = "go run ./cmd/postoffice"

[tasks.build]
description = "Build all Go packages"
run = "go build ./..."

[tasks.fmt]
description = "Format all Go packages"
run = "go fmt ./..."

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.test-race]
description = "Run the test suite with the race detector"
run = "go test -race ./..."

[tasks.vet]
description = "Run Go static analysis"
run = "go vet ./..."

[tasks.vuln]
description = "Scan Go dependencies for known vulnerabilities"
run = "go tool govulncheck ./..."

[tasks.check]
description = "Run tests, race detection, vet, and vulnerability scanning"
run = [
  "go test ./...",
  "go test -race ./...",
  "go vet ./...",
  "go tool govulncheck ./...",
]

[tasks.vhs]
description = "Record and verify the online TUI journey with Docker"
run = "./testdata/vhs/check.sh"

[tasks.landing-demo]
description = "Record the deterministic terminal journey for the landing page"
run = "./testdata/vhs/record-landing.sh"

[tasks.release-check]
description = "Build and verify a local snapshot of every release artifact"
run = "docker run --rm -v \"$PWD:/work\" -w /work goreleaser/goreleaser@sha256:a7609141326e383370858ab3ca2572e96e00fb212fe3fd5610cd4de434652faa release --snapshot --clean && ./scripts/check-release.sh dist"

[tasks.db-generate]
description = "Generate typed PostgreSQL queries"
run = "go tool sqlc generate"

[tasks.db-test]
description = "Run PostgreSQL integration tests in Docker"
run = "./testdata/postgres/check.sh"

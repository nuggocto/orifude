version: 2

project_name: orifude

before:
  hooks:
    - go mod download

builds:
  - id: orifude
    main: ./cmd/orifude
    binary: orifude
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    goamd64:
      - v1

archives:
  - id: orifude
    ids:
      - orifude
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

report_sizes: true

scoops:
  - name: orifude
    ids:
      - orifude
    repository:
      owner: nuggocto
      name: scoop-bucket
      branch: shrek
      token: "{{ .Env.RELEASE_PUBLISH_TOKEN }}"
    directory: bucket
    homepage: https://orifude.com
    description: A quiet, pseudonymous one-to-one letter exchange for the terminal
    license: Apache-2.0

aurs:
  - name: orifude-bin
    ids:
      - orifude
    homepage: https://orifude.com
    description: A quiet, pseudonymous one-to-one letter exchange for the terminal
    maintainers:
      - Vincent <vincent at sshmoi dot com>
    license: Apache-2.0
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/orifude-bin.git
    provides:
      - orifude
    conflicts:
      - orifude
    package: |-
      install -Dm755 "./orifude" "${pkgdir}/usr/bin/orifude"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/orifude/LICENSE"
    commit_author:
      name: nuggocto
      email: aur@sshmoi.com
    disable: "{{ .IsSnapshot }}"
